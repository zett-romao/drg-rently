name: Deploy Cloudflare Worker (Feed XML portais)

# Roda sempre que o worker do feed ou o wrangler-feed.toml mudarem no main,
# ou manualmente pela aba Actions do GitHub.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker-feed.js'
      - 'wrangler-feed.toml'
      - '.github/workflows/deploy-feed.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy worker via Wrangler (config separada)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-feed.toml
