name: Deploy Cloudflare Worker (Bureaus de crédito)

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker-bureaus.js'
      - 'wrangler-bureaus.toml'
      - '.github/workflows/deploy-bureaus.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy worker via Wrangler (config separada)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-bureaus.toml
