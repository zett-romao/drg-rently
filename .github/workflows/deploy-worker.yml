name: Deploy Cloudflare Worker (Gemini)

# Roda sempre que o worker ou o wrangler.toml mudarem no main,
# ou manualmente pela aba Actions do GitHub.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker-gemini.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy worker via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
