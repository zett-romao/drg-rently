name: Deploy Cloudflare Worker (ZapSign)

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker-zapsign.js'
      - 'wrangler-zapsign.toml'
      - '.github/workflows/deploy-zapsign.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy worker via Wrangler (config separada)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-zapsign.toml
