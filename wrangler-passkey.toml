# =============================================================
# Config do Cloudflare Worker — DRG-Rently Passkey (WebAuthn)
#
# Login biométrico via Passkeys (Windows Hello, TouchID, FaceID, etc).
#
# Deploy automático via .github/workflows/deploy-passkey.yml
#
# Setup manual no Cloudflare antes do primeiro deploy:
#   1. Criar KV namespace "PASSKEYS_KV" e colar o ID aqui (campo abaixo)
#   2. Cadastrar Secret FIREBASE_SERVICE_ACCOUNT_JSON
#      → Cole o JSON COMPLETO de uma service account com permissão
#        "Firebase Authentication Admin" (Firebase Console → Configurações
#        do projeto → Contas de serviço → Gerar nova chave privada).
#   3. RP_ID / RP_NAME / ORIGIN ficam AQUI em [vars] (antes eram cadastradas
#      no painel e cada deploy automático as apagava). O domínio rently.dev.br
#      é tratado no código (RPS_EXTRAS) — RP_ID/ORIGIN abaixo valem para o
#      endereço antigo e para qualquer origem não listada.
# =============================================================
name = "drg-rently-passkey"
main = "cloudflare-worker-passkey.js"
compatibility_date = "2024-09-01"
keep_vars = true   # preserva variáveis do painel a cada deploy automático
compatibility_flags = ["nodejs_compat"]

# KV binding — substitua o ID abaixo pelo da namespace que VOCÊ criou.
[[kv_namespaces]]
binding = "PASSKEYS_KV"
id = "3832a2f3ed7d4209b9d5ce716cef6a74"

# Variáveis (não são segredo). Mudou o domínio principal? Mude aqui.
[vars]
RP_ID = "zett-romao.github.io"
RP_NAME = "DRG-Rently"
ORIGIN = "https://zett-romao.github.io"
