# =============================================================
# Config do Cloudflare Worker — DRG-Rently Sites (domínio próprio dos clientes)
#
# Deploy automático via .github/workflows/deploy-sites.yml
# CF_ZONE_ID (variável) e CF_API_TOKEN (secret) ficam no painel do Cloudflare
# (keep_vars preserva o que estiver lá). Rota "*/*" na zona rently.dev.br entra
# quando a zona estiver na Cloudflare com SSL for SaaS ligado (ver CLAUDE.md).
# =============================================================
name = "drg-rently-sites"
main = "cloudflare-worker-sites.js"
compatibility_date = "2024-09-01"
keep_vars = true

[vars]
ALVO_CNAME = "sites.rently.dev.br"
CF_ZONE_ID = "833e6f59ea1abe8fc346294a4a2effa5"   # zona rently.dev.br (não é segredo; o token CF_API_TOKEN é secret no painel)
