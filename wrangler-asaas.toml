# =============================================================
# Config do Cloudflare Worker — DRG-Rently Asaas
#
# Cobrança de mensalidades (uso DRG Global) + endpoints /tenant/*
# para imobiliárias cobrarem locatários e pagarem locadores via
# sua própria chave Asaas.
#
# Deploy automático via .github/workflows/deploy-asaas.yml
#
# Setup manual no Cloudflare (one-time):
#   - Secrets: ASAAS_API_KEY (da DRG), WEBHOOK_TOKEN, FIREBASE_API_KEY
#   - Secret FIREBASE_SERVICE_ACCOUNT_JSON — JSON COMPLETO da service account
#     (a MESMA usada no Worker passkey). Necessário pro 2FA: o Worker grava o
#     segredo TOTP na coleção mfa/{uid}, que é default-deny pro cliente.
#   - Variables: PROJECT_ID = drg-rently, ASAAS_ENV = "production"
#   - Webhooks no painel Asaas → URL do worker /webhook
# =============================================================
name = "drg-rently-asaas"
main = "cloudflare-worker-asaas.js"
compatibility_date = "2024-09-01"
