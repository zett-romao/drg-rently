# =============================================================
# Config do Cloudflare Worker — DRG-Rently Resend (proxy de e-mail)
#
# Proxia chamadas pra Resend API. Usado pelo app pra enviar:
#   - Balancetes pra locadores
#   - Convites de operador (senha inicial)
#   - Outras notificações
#
# Deploy automático via .github/workflows/deploy-resend.yml
# Setup manual no Cloudflare (uma vez):
#   - Adicionar secret RESEND_API_KEY (pegar em resend.com/api-keys)
# =============================================================
name = "drg-rently-resend"
main = "cloudflare-worker-resend.js"
compatibility_date = "2024-09-01"
