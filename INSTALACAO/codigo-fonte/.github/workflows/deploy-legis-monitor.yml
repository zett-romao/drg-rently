name: Deploy Cloudflare Worker (Legis Monitor)

# Dispara em mudanças no worker monitor ou no wrangler dele,
# ou manualmente pela aba Actions do GitHub.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker-legis-monitor.js'
      - 'wrangler-legis-monitor.toml'
      - '.github/workflows/deploy-legis-monitor.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy worker via Wrangler (config separada)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-legis-monitor.toml
